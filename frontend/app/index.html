<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A7SYSTEM - Gestão Empresarial</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- LOADING GLOBAL -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container"></div>

  <!-- MODAL GLOBAL -->
  <div id="modal-overlay">
    <div class="modal-content" id="modal-content">
      <!-- Injetado dinamicamente via JS -->
    </div>
  </div>

  <!-- TELA DE LOGIN -->
  <div id="login-container">
    <!-- Renderizado via js/pages/login.js -->
  </div>

  <!-- ESTRUTURA PRINCIPAL (SPA) -->
  <div id="app-container" class="hidden">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-logo">A7SYSTEM</div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <ul>
          <li><a href="#/dashboard" class="nav-item" data-path="/dashboard" data-roles="master,adm,vendedor,estoque"><span class="nav-icon">📊</span> Dashboard</a></li>
          <li><a href="#/empresas" class="nav-item" data-path="/empresas" data-roles="master,adm"><span class="nav-icon">🏢</span> Empresas</a></li>
          <li><a href="#/usuarios" class="nav-item" data-path="/usuarios" data-roles="master,adm"><span class="nav-icon">👥</span> Usuários</a></li>
          <li><a href="#/fornecedores" class="nav-item" data-path="/fornecedores" data-roles="master,adm,estoque"><span class="nav-icon">🚚</span> Fornecedores</a></li>
          <li><a href="#/clientes" class="nav-item" data-path="/clientes" data-roles="master,adm,vendedor"><span class="nav-icon">🧑‍💼</span> Clientes</a></li>
          <li><a href="#/produtos" class="nav-item" data-path="/produtos" data-roles="master,adm,vendedor,estoque"><span class="nav-icon">📦</span> Produtos</a></li>
          <li><a href="#/estoque" class="nav-item" data-path="/estoque" data-roles="master,adm,estoque"><span class="nav-icon">🏭</span> Estoque</a></li>
          <li><a href="#/saidas" class="nav-item" data-path="/saidas" data-roles="master,adm,estoque"><span class="nav-icon">📉</span> Saídas e Ajustes</a></li>
          <li><a href="#/compras" class="nav-item" data-path="/compras" data-roles="master,adm,estoque"><span class="nav-icon">🛒</span> Compras</a></li>
          <li><a href="#/contas-pagar" class="nav-item" data-path="/contas-pagar" data-roles="master,adm"><span class="nav-icon">💸</span> Contas a Pagar</a></li>
          <li><a href="#/vendas" class="nav-item" data-path="/vendas" data-roles="master,adm,vendedor"><span class="nav-icon">🧾</span> Vendas</a></li>
          <li><a href="#/recebimentos" class="nav-item" data-path="/recebimentos" data-roles="master,adm"><span class="nav-icon">💰</span> Recebimentos</a></li>
          <li><a href="#/crm" class="nav-item" data-path="/crm" data-roles="master,adm,vendedor"><span class="nav-icon">🤝</span> CRM</a></li>
          <li><a href="#/devolucoes" class="nav-item" data-path="/devolucoes" data-roles="master,adm,estoque"><span class="nav-icon">🔄</span> Devoluções</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        Versão 1.0.0
      </div>
    </aside>

    <!-- Content Area -->
    <div id="main-content">
      <!-- Top Bar -->
      <header id="top-bar">
        <div class="top-bar-left">
          <button id="mobile-menu-btn" class="btn btn-outline" style="display: none;">☰</button>
          <div class="empresa-info">
            <select id="empresa-selector" class="form-control" style="min-width: 200px;">
              <option value="">Carregando empresas...</option>
            </select>
          </div>
        </div>
        <div class="top-bar-right">
          <span id="user-profile-name" style="font-weight: 500;">Usuário</span>
          <button id="btn-logout" class="btn btn-secondary">Sair</button>
        </div>
      </header>

      <!-- Page Content (Dynamic) -->
      <main id="page-content">
        <!-- Renderizado via app.js -->
      </main>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-check-compat.js"></script>

  <!-- Scripts locais -->
  <script src="js/firebase-config.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/components.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/usuarios.js"></script>
  <script src="js/pages/empresas.js"></script>
  <script src="js/pages/fornecedores.js"></script>
  <script src="js/pages/clientes.js"></script>
  <script src="js/pages/produtos.js"></script>
  <script src="js/pages/compras.js"></script>
  <script src="js/pages/contas-pagar.js"></script>
  <script src="js/pages/estoque.js"></script>
  <script src="js/pages/saidas.js"></script>
  <script src="js/pages/devolucoes.js"></script>
  <script src="js/pages/vendas.js"></script>
  <script src="js/pages/recebimentos.js"></script>
  <script src="js/pages/crm.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
