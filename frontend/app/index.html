<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A7SYSTEM - Gestão Empresarial</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- LOADING GLOBAL -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container"></div>

  <!-- MODAL GLOBAL -->
  <div id="modal-overlay">
    <div class="modal-content" id="modal-content">
      <!-- Injetado dinamicamente via JS -->
    </div>
  </div>

  <!-- TELA DE LOGIN -->
  <div id="login-container">
    <!-- Renderizado via js/pages/login.js -->
  </div>

  <!-- ESTRUTURA PRINCIPAL (SPA) -->
  <div id="app-container" class="hidden">
    <!-- Sidebar / Drawer -->
    <aside id="sidebar" aria-label="Menu Principal">
      <div class="sidebar-header">
        <div class="sidebar-logo">A7SYSTEM</div>
        <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Fechar menu" title="Fechar menu">&times;</button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Itens gerados por app.js a partir dos módulos permitidos ao usuário -->
        <ul id="sidebar-nav-list">
          <li class="nav-empty">Carregando módulos...</li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        Versão 1.0.0
      </div>
    </aside>

    <!-- Overlay Backdrop para fechar drawer com toque no mobile -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Content Area -->
    <div id="main-content">
      <!-- Top Bar -->
      <header id="top-bar">
        <div class="top-bar-left">
          <button id="mobile-menu-btn" class="btn btn-outline mobile-menu-btn" aria-label="Abrir menu de navegação" aria-controls="sidebar" aria-expanded="false">
            <span class="hamburger-icon">☰</span>
          </button>
          <div class="empresa-info">
            <select id="empresa-selector" class="form-control" aria-label="Selecionar empresa">
              <option value="">Carregando empresas...</option>
            </select>
          </div>
        </div>
        <div class="top-bar-right">
          <span id="user-profile-name" class="user-profile-name">Usuário</span>
          <button id="btn-logout" class="btn btn-secondary">Sair</button>
        </div>
      </header>

      <!-- Page Content (Dynamic) -->
      <main id="page-content">
        <!-- Renderizado via app.js -->
      </main>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-check-compat.js"></script>

  <!-- Scripts locais -->
  <script src="js/firebase-config.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/permissions.js"></script>
  <script src="../shared/components.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/usuarios.js"></script>
  <script src="js/pages/empresas.js"></script>
  <script src="js/pages/fornecedores.js"></script>
  <script src="js/pages/clientes.js"></script>
  <script src="js/pages/produtos.js"></script>
  <script src="js/pages/compras.js"></script>
  <script src="js/pages/contas-pagar.js"></script>
  <script src="js/pages/estoque.js"></script>
  <script src="js/pages/saidas.js"></script>
  <script src="js/pages/devolucoes.js"></script>
  <script src="js/pages/vendas.js"></script>
  <script src="js/pages/recebimentos.js"></script>
  <script src="js/pages/crm.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
